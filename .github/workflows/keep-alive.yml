name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # Every 14 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hermes Gateway
        run: |
          curl -sf https://hermes-gateway.onrender.com/health || echo "Service may be starting up"
